name: BMW X1 - Auditoria automatica
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir dados e app
        run: |
          node scripts/audit.mjs
          node --check scripts/browser-smoke.mjs
      - name: Install Playwright package
        if: github.event_name != 'pull_request'
        run: |
          npm init -y
          npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Verify system Chrome
        if: github.event_name != 'pull_request'
        run: google-chrome --version
      - name: Read-only Chromium smoke
        if: github.event_name != 'pull_request'
        env:
          ARENA_URL: https://aureon-tech.github.io/ARENA-X1/
        run: node scripts/browser-smoke.mjs
